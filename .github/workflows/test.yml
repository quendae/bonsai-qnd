name: static-tests
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell/static tests
        run: sh tests/run-static.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell/static tests
        shell: pwsh
        run: ./tests/run-static.ps1
