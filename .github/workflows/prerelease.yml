name: prerelease

on:
  push:
    branches:
      - main
      - feat/gui-launcher-working
      - fix/windows-ps51-start-pre3
      - feat/reasoning-level-pre4
    paths:
      - 'launcher/**'
      - 'installer/**'
      - 'config/**'
      - 'scripts/**'
      - 'qnd.ps1'
      - 'start-*.bat'
      - 'tests/**'
      - '.github/workflows/prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.1.0-pre.4
  TAG: v0.1.0-pre.4

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static tests
        shell: pwsh
        run: ./tests/run-static.ps1

      - name: Publish Windows launcher
        shell: pwsh
        run: |
          dotnet publish launcher\BonsaiQND\BonsaiQND.csproj -c Release -r win-x64 --self-contained true -o dist\launcher /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'dist\launcher\BonsaiQND.exe')) { throw 'Expected BonsaiQND.exe was not published.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler missing: $iscc" }
          & $iscc "/DAppVersion=$env:VERSION" installer\BonsaiQND.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $installer = 'dist\BonsaiQND-Setup-v0.1.0-pre.4.exe'
          if (-not (Test-Path $installer)) { throw "Expected installer missing: $installer" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonsaiQND-Setup-v0.1.0-pre.4
          path: dist/BonsaiQND-Setup-v0.1.0-pre.4.exe

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'dist/BonsaiQND-Setup-v0.1.0-pre.4.exe'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $asset --clobber
          } else {
            gh release create $env:TAG $asset --target $env:GITHUB_SHA --title 'Bonsai QND v0.1.0-pre.4' --notes-file installer/RELEASE_NOTES.md --prerelease
          }
